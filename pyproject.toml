[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenmetal-kicad"
version = "0.1.3"
description = "KiCad plugin: push a BOM to ProvenMetal Central and flag long-lead / unsourceable parts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ProvenMetal" }]
dependencies = [
    "kicad-python>=0.4.0",
]

[project.scripts]
provenmetal-kicad = "provenmetal_kicad.cli:main"

[tool.setuptools]
package-dir = { "" = "plugin" }

[tool.setuptools.packages.find]
where = ["plugin"]

[tool.pytest.ini_options]
pythonpath = ["plugin", "tests"]
testpaths = ["tests"]
